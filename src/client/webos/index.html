<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VideoJuke for webOS</title>
    <link rel="stylesheet" href="player.css" />
    <link rel="stylesheet" href="webos.css" />
    <script src="webOSTVjs-1.2.12/webOSTV.js"></script>
  </head>
  <body>
    <div id="configScreen" class="config-screen">
      <div class="config-container">
        <h1 class="config-title">VideoJuke</h1>
        <form id="configForm" class="config-form">
          <div class="form-group">
            <label class="form-label" for="serverHost">Server address</label>
            <input type="text" id="serverHost" class="form-input" placeholder="192.168.1.100" />
          </div>
          <div class="form-group">
            <label class="form-label" for="serverPort">Port</label>
            <input type="number" id="serverPort" class="form-input" placeholder="3123" />
          </div>
          <div class="form-group">
            <label class="form-label" for="serverToken">Access token</label>
            <input type="text" id="serverToken" class="form-input" placeholder="from the server log" />
          </div>
          <div class="form-group">
            <label class="form-label" for="serverRole">Screen role</label>
            <input type="text" id="serverRole" class="form-input" placeholder="leader, follower, or blank" />
          </div>
          <button type="submit" id="connectButton" class="form-button">Connect</button>
        </form>
        <div class="config-help">
          Use the arrow keys to move between fields and OK to confirm.
        </div>
        <div id="configError" class="config-error"></div>
      </div>
    </div>

    <div id="loadingScreen" class="loading-screen hidden">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <div id="loadingSubtitle" class="loading-subtitle">Connecting to VideoJuke server...</div>
        <div class="progress-bar">
          <div id="loadingProgress" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <div class="video-container">
      <video id="video1" class="video-player" playsinline></video>
      <video id="video2" class="video-player" playsinline></video>
    </div>

    <div id="infoOverlay" class="overlay info-overlay">
      <div id="videoTitle"></div>
      <div id="videoDetails"></div>
    </div>

    <div id="errorOverlay" class="overlay error-overlay">
      <div id="errorMessage"></div>
    </div>

    <div id="statusIndicator" class="overlay status-indicator">
      <div id="statusIcon"></div>
    </div>

    <div id="controlsOverlay" class="panel controls-overlay">
      <h3>Remote Control Guide</h3>
      <div class="controls-grid">
        <div class="control-item"><span class="control-button">OK</span> <span>Play/Pause</span></div>
        <div class="control-item"><span class="control-button">&rarr;</span> <span>Next video</span></div>
        <div class="control-item"><span class="control-button">&larr;</span> <span>Previous video</span></div>
        <div class="control-item">
          <span class="control-button">&uarr;/&darr;</span> <span>Speed control</span>
        </div>
        <div class="control-item">
          <span class="control-button color-red">RED</span> <span>Toggle crossfade</span>
        </div>
        <div class="control-item">
          <span class="control-button color-green">GREEN</span> <span>Toggle blur</span>
        </div>
        <div class="control-item">
          <span class="control-button color-yellow">YELLOW</span> <span>Show info</span>
        </div>
        <div class="control-item">
          <span class="control-button color-blue">BLUE</span> <span>Settings</span>
        </div>
        <div class="control-item"><span class="control-button">BACK</span> <span>Exit/menu</span></div>
      </div>
    </div>

    <script src="client.js"></script>
  </body>
</html>
